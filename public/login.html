<style>
  :root { --bg: #ffffff; --surface: #fbfbfb; --fg: #23262b; --muted: #6e727b; --line: #e5e7eb; --cta: #000; --cta-fg: #fff; --err: #dc2626; --focus: #111; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --surface: #1a1a1a; --fg: #f2f2f2; --muted: #a1a1a1; --line: #2e2e2e; --cta: #fff; --cta-fg: #000; --err: #ef4444; --focus: #fff; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; padding: 16px; -webkit-font-smoothing: antialiased; }
  .card { width: 100%; max-width: 380px; padding: 32px 28px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  form { display: grid; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; }
  .mark { width: 28px; height: 28px; border-radius: 7px; background: #000; display: grid; place-items: center; }
  .mark img { width: 20px; height: 20px; }
  .brand span { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 16px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  input, button { font: inherit; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line); }
  input { background: var(--bg); color: inherit; outline: none; }
  input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
  button { background: var(--cta); color: var(--cta-fg); border: 0; border-radius: 999px; font-weight: 500; cursor: pointer; margin-top: 4px; }
  button:hover { opacity: .88; }
  .err { color: var(--err); display: none; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark"><img src="/orbit/logo-mark.png?v=orbit3" alt=""></span><span>Orbit</span></div>
  <form method="post" action="/orbit/login">
    <h1>Sign in</h1>
    <p>Private console for this server.</p>
    <p class="err" id="err">Wrong password.</p>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Continue</button>
  </form>
</div>
<script>if (location.search.includes('err=1')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
